<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounts/register.css' %}">
</head>
<body>
    <a href="{% url 'home' %}" class="home-icon" title="Back to Home">🏠</a>
    
    <form method="post" class="form-container">
        <h1>Register</h1>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="form-errors">
                        {{ field.errors }}
                    </div>
                {% endif %}
                {% if field.help_text %}
                    <small class="help-text">{{ field.help_text|safe }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="submit-btn">Register</button>
        <p class="form-footer">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </form>
</body>
</html>
